<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Farda studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block">
<style>
  /* Vazirmatn (Persian lettering), served from node_modules so it works offline */
  @font-face { font-family: Vazirmatn; src: url("node_modules/vazirmatn/fonts/webfonts/Vazirmatn[wght].woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><button id="play" title="play with the music (space)">▶</button><input id="scrub" type="range" min="0" max="166.3" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/styles.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/fardi.js"></script>
<script src="src/people.js"></script>
<script src="src/props.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<!-- your video: add a script per scene file, in order -->
<!-- the story video «از امروز به فردا بیایید» (STORYBOARD_STORY.md). For the 24-second intro instead, load
     src/scenes/farda_intro.js here (without story_sync.js) and set duration: 24 in src/config.js, without audio. -->
<script src="src/scenes/story_common.js"></script>
<script src="src/scenes/story_1_today.js"></script>
<script src="src/scenes/story_2_find.js"></script>
<script src="src/scenes/story_3_farda.js"></script>
<script src="src/scenes/story_4_future.js"></script>
<!-- the song: fits every shot above to the music (assets/music.m4a) -->
<script src="src/scenes/story_sync.js"></script>
<!-- the 9:16 Reels framing, used only with ?reel / render.mjs --reel -->
<script src="src/scenes/story_reel.js"></script>
<!-- the covers: ?loop=thumbnail (YouTube) and ?reel&loop=cover (Shorts, Reels) -->
<script src="src/thumbnail.js"></script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
